name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # tests/library.rs uses the library the way applications do, including
      # two writers on one shared file.
      - run: cargo test

  spec:
    name: agrees with eon-office-spec
    # The spec's examples, read through the core's own readers. A schema and an
    # implementation that disagree make a manifest that validates and is then
    # refused.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: EON-Extensible-Open-Network/eon-office-spec
          path: spec
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test spec_examples -- --ignored
        env:
          EON_OFFICE_SPEC_DIR: spec

  invariants:
    name: project invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No telemetry (madde 36)
        run: |
          if grep -rIn -iE 'telemetry|analytics|sentry|mixpanel|posthog' src Cargo.toml; then
            echo "::error::telemetry-shaped code found (madde 36)"
            exit 1
          fi
      - name: No GUI dependency in the core
        run: |
          if grep -nE '^\s*(tauri|wry|tao|winit|gtk|egui|iced|slint|druid)\b' Cargo.toml; then
            echo "::error::the core never takes a GUI dependency"
            exit 1
          fi
      - name: A library, not a service
        # The core is code applications link (plan v0.8, madde 43). A binary
        # target or a listening socket would bring the service back.
        run: |
          if grep -nE '^\[\[bin\]\]' Cargo.toml || [ -e src/main.rs ]; then
            echo "::error::eon-office-core has no binary target"
            exit 1
          fi
          if grep -rnE 'TcpListener|UdpSocket|UnixListener' src; then
            echo "::error::eon-office-core does not listen on anything"
            exit 1
          fi

  deny:
    name: licences · advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check all

  reuse:
    name: licence headers (REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5

  dco:
    name: signed-off commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Every commit must carry Signed-off-by
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::missing Signed-off-by: $(git log -1 --oneline "$sha")"
              missing=1
            fi
          done < <(git rev-list "$base..$head")
          exit $missing
