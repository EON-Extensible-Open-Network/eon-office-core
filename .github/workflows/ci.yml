name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # tests/protocol.rs starts the real binary and speaks the protocol over a
      # socket, without the SDK: the wire format is the contract.
      - run: cargo test

  invariants:
    name: project invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No telemetry (madde 36)
        run: |
          if grep -rIn -iE 'telemetry|analytics|sentry|mixpanel|posthog' src Cargo.toml; then
            echo "::error::telemetry-shaped code found (madde 36)"
            exit 1
          fi
      - name: No GUI dependency in the core
        run: |
          if grep -nE '^\s*(tauri|wry|tao|winit|gtk|egui|iced|slint|druid)\b' Cargo.toml; then
            echo "::error::the core never takes a GUI dependency"
            exit 1
          fi
      - name: Loopback only (madde 30)
        # The only listening address the core accepts is loopback; serving a
        # network is eon-office-server's job, behind madde 30's gate.
        run: |
          grep -q 'is_loopback()' src/server.rs || { echo "::error::loopback check removed"; exit 1; }
          if grep -rnE '0\.0\.0\.0|\[::\]' src; then
            echo "::error::a wildcard listening address appeared"
            exit 1
          fi

  deny:
    name: licences · advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check all

  reuse:
    name: licence headers (REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5

  dco:
    name: signed-off commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Every commit must carry Signed-off-by
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::missing Signed-off-by: $(git log -1 --oneline "$sha")"
              missing=1
            fi
          done < <(git rev-list "$base..$head")
          exit $missing
